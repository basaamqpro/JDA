    <style>

        }

            font-family: Arial, sans-serif;

            margin-bottom: 6px;
            font-weight: bold;

            border: 1px solid #ccc;

            border: 1px solid #ddd;

            color: white;

            padding: 18px 20px;

            margin: 0;

            padding: 20px;

            display: grid;
            grid-template-columns:

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;

        .form-group.full {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-weight: bold;
            font-size: 13px;
            color: #555;

            padding: 10px;

        .checkbox-row {
            display: flex;

            flex-wrap: wrap;

            display: flex;
            gap: 7px;

           ENTITY SELECTOR

            grid-template-columns:

        .summary-card {
            background: #fafafa;
            border: 1px solid #eee;
            border-radius: 8px;

        /* =====================================================
           EMPTY
        ===================================================== */

            color: #777;
            padding: 10px 0;
        }


        /* =====================================================
           RESPONSIVE
        ===================================================== */

        @media (max-width: 800px) {

            .form-grid {
                grid-template-columns: 1fr;

            .form-group.full {
                grid-column: auto;
            }

            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }

    </style>

</head>

<script>

// =====================================================
// STAGE 4B
// IN-MEMORY CREATE / EDIT / DELETE
// =====================================================


// =====================================================
// GLOBAL STATE
// =====================================================

let selectedCompanyId =
    companies.length > 0
        ? companies[0].company_id
        : null;


let currentTab = "company";

let currentContactId = null;

let currentActivityId = null;

let currentActionId = null;

let newRecordMode = false;



// =====================================================
// BASIC DATA HELPERS
// =====================================================

function getCompany(companyId) {

    return companies.find(
        company =>
            company.company_id === companyId
    );

}


function getApplication(companyId) {

    return applications.find(
        application =>
            application.company_id === companyId
    );

}


function getContacts(companyId) {

    return contacts.filter(
        contact =>
            contact.company_id === companyId
    );

}


function getActivities(companyId) {

    return activities
        .filter(
            activity =>
                activity.company_id === companyId
        )
        .sort(
            (a, b) =>
                new Date(b.occurred_at)
                -
                new Date(a.occurred_at)
        );

}


function getActions(companyId) {

    return actions
        .filter(
            action =>
                action.company_id === companyId
        )
        .sort(
            (a, b) =>
                new Date(a.due_date)
                -
                new Date(b.due_date)
        );

}



// =====================================================
// FORM VALUE HELPERS
// =====================================================

function setValue(id, value) {

    const element =
        document.getElementById(id);


    if (!element) {
        return;
    }


    element.value =
        value ?? "";

}


function getValue(id) {

    const element =
        document.getElementById(id);


    if (!element) {
        return "";
    }


    return element.value.trim();

}


function getNumberValue(id) {

    const value =
        getValue(id);


    if (value === "") {
        return 0;
    }


    return Number(value);

}


function setChecked(id, value) {

    const element =
        document.getElementById(id);


    if (!element) {
        return;
    }


    element.checked =
        value === true;

}


function getChecked(id) {

    const element =
        document.getElementById(id);


    if (!element) {
        return false;
    }


    return element.checked;

}


function nullable(value) {

    if (
        value === undefined
        ||
        value === null
        ||
        value === ""
    ) {

        return null;

    }


    return value;

}



// =====================================================
// AUTOMATIC ID GENERATOR
// =====================================================

function generateId(
    prefix,
    collection,
    property
) {

    let highestNumber = 0;


    collection.forEach(item => {

        const id =
            item[property];


        if (!id) {
            return;
        }


        if (
            !id.startsWith(prefix)
        ) {
            return;
        }


        const numberPart =
            Number(
                id.substring(
                    prefix.length
                )
            );


        if (
            !Number.isNaN(numberPart)
            &&
            numberPart > highestNumber
        ) {

            highestNumber =
                numberPart;

        }

    });


    const nextNumber =
        highestNumber + 1;


    return (
        prefix
        +
        String(nextNumber)
            .padStart(
                3,
                "0"
            )
    );

}



// =====================================================
// ARRAY DELETE HELPER
// =====================================================

function removeFromArray(
    array,
    condition
) {

    for (
        let i = array.length - 1;
        i >= 0;
        i--
    ) {

        if (
            condition(array[i])
        ) {

            array.splice(
                i,
                1
            );

        }

    }

}



// =====================================================
// DATETIME HELPERS
// =====================================================

function toDateTimeLocal(value) {

    if (!value) {
        return "";
    }


    const date =
        new Date(value);


    const pad =
        number =>
            String(number)
                .padStart(
                    2,
                    "0"
                );


    return (
        date.getFullYear()
        +
        "-"
        +
        pad(
            date.getMonth() + 1
        )
        +
        "-"
        +
        pad(
            date.getDate()
        )
        +
        "T"
        +
        pad(
            date.getHours()
        )
        +
        ":"
        +
        pad(
            date.getMinutes()
        )
    );

}


function fromDateTimeLocal(value) {

    if (!value) {
        return null;
    }


    return value + ":00";

}


function getCurrentLocalDateTime() {

    const now =
        new Date();


    const pad =
        number =>
            String(number)
                .padStart(
                    2,
                    "0"
                );


    return (
        now.getFullYear()
        +
        "-"
        +
        pad(
            now.getMonth() + 1
        )
        +
        "-"
        +
        pad(
            now.getDate()
        )
        +
        "T"
        +
        pad(
            now.getHours()
        )
        +
        ":"
        +
        pad(
            now.getMinutes()
        )
    );

}



// =====================================================
// NOTIFICATION
// =====================================================

function showMessage(
    message,
    type = "success"
) {

    const oldMessage =
        document.getElementById(
            "stage4Message"
        );


    if (oldMessage) {

        oldMessage.remove();

    }


    const box =
        document.createElement(
            "div"
        );


    box.id =
        "stage4Message";


    box.style.position =
        "fixed";

    box.style.right =
        "20px";

    box.style.bottom =
        "20px";

    box.style.zIndex =
        "9999";

    box.style.padding =
        "14px 18px";

    box.style.borderRadius =
        "8px";

    box.style.maxWidth =
        "400px";

    box.style.boxShadow =
        "0 4px 20px rgba(0,0,0,0.15)";


    if (
        type === "error"
    ) {

        box.style.background =
            "#ffe7e7";

        box.style.border =
            "1px solid #d88";

    }

    else {

        box.style.background =
            "#e5f6e9";

        box.style.border =
            "1px solid #8cba96";

    }


    box.textContent =
        message;


    document.body.appendChild(
        box
    );


    setTimeout(
        () => {

            if (
                box.parentNode
            ) {

                box.remove();

            }

        },
        3000
    );

}



// =====================================================
// COMPANY SELECTOR
// =====================================================

function renderCompanySelector() {

    const selector =
        document.getElementById(
            "companySelector"
        );


    selector.innerHTML = "";


    if (
        companies.length === 0
    ) {

        const option =
            document.createElement(
                "option"
            );


        option.value = "";

        option.textContent =
            "No companies";


        selector.appendChild(
            option
        );


        return;

    }


    companies.forEach(
        company => {

            const option =
                document.createElement(
                    "option"
                );


            option.value =
                company.company_id;


            option.textContent =
                company.name;


            if (
                company.company_id ===
                selectedCompanyId
            ) {

                option.selected =
                    true;

            }


            selector.appendChild(
                option
            );

        }
    );

}



// =====================================================
// COMPANY SUMMARY
// =====================================================

function renderCompanySummary() {

    const area =
        document.getElementById(
            "companySummary"
        );


    if (!selectedCompanyId) {

        area.innerHTML = "";

        return;

    }


    const application =
        getApplication(
            selectedCompanyId
        );


    const companyContacts =
        getContacts(
            selectedCompanyId
        );


    const companyActivities =
        getActivities(
            selectedCompanyId
        );


    const companyActions =
        getActions(
            selectedCompanyId
        );


    area.innerHTML = `

        <div class="summary-card">

            <strong>
                ${application ? 1 : 0}
            </strong>

            <span>
                Application
            </span>

        </div>


        <div class="summary-card">

            <strong>
                ${companyContacts.length}
            </strong>

            <span>
                Contacts
            </span>

        </div>


        <div class="summary-card">

            <strong>
                ${companyActivities.length}
            </strong>

            <span>
                Activities
            </span>

        </div>


        <div class="summary-card">

            <strong>

                ${
                    companyActions.filter(
                        action =>
                            action.status ===
                            "pending"
                    ).length
                }

            </strong>

            <span>
                Pending Actions
            </span>

        </div>

    `;

}



// =====================================================
// REFRESH
// =====================================================

function refreshManagePage() {

    // ---------------------------------------------
    // LOCAL CACHE
    // ---------------------------------------------

    saveCareerData();



    // ---------------------------------------------
    // FIREBASE
    // ---------------------------------------------

    if (
        window.fireCareer
    ) {

        window.fireCareer
            .saveAll()
            .then(
                () => {

                    console.log(
                        "Firebase sync complete."
                    );

                }
            )
            .catch(
                error => {

                    console.error(
                        "Firebase sync failed:",
                        error
                    );

                    showMessage(
                        "Saved locally, but Firebase sync failed.",
                        "error"
                    );

                }
            );

    }



    // ---------------------------------------------
    // UI
    // ---------------------------------------------

    renderCompanySelector();

    renderCompanySummary();

    renderCurrentTab();

}


// =====================================================
// TAB HANDLING
// =====================================================

function activateTab(tabName) {

    currentTab =
        tabName;


    newRecordMode =
        false;


    document
        .querySelectorAll(
            ".tab-button"
        )
        .forEach(
            button => {

                button.classList.toggle(
                    "active",
                    button.dataset.tab ===
                    tabName
                );

            }
        );


    renderCurrentTab();

}



// =====================================================
// MAIN RENDER ROUTER
// =====================================================

function renderCurrentTab() {

    if (
        currentTab !== "company"
        &&
        !selectedCompanyId
    ) {

        document.getElementById(
            "panelContent"
        ).innerHTML =
            `
            <div class="empty">
                Create a company first.
            </div>
            `;

        return;

    }


    switch (currentTab) {

        case "company":

            renderCompanyForm();

            break;


        case "application":

            renderApplicationForm();

            break;


        case "contact":

            renderContactForm();

            break;


        case "activity":

            renderActivityForm();

            break;


        case "action":

            renderActionForm();

            break;

    }

}



// =====================================================
// FORM BUTTON HTML
// =====================================================

function formButtons(
    existingRecord
) {

    return `

        <div class="form-actions">

            <button
                id="saveRecordButton"
                class="primary-button"
            >
                ${
                    existingRecord
                        ?
                        "Save Changes"
                        :
                        "Create Record"
                }
            </button>


            ${
                existingRecord
                    ?
                    `
                    <button
                        id="deleteRecordButton"
                        class="danger-button"
                    >
                        Delete
                    </button>
                    `
                    :
                    ""
            }

        </div>

    `;

}



// =====================================================
// ATTACH SAVE / DELETE BUTTONS
// =====================================================

function attachFormButtons(
    saveFunction,
    deleteFunction = null
) {

    const saveButton =
        document.getElementById(
            "saveRecordButton"
        );


    if (saveButton) {

        saveButton.addEventListener(
            "click",
            saveFunction
        );

    }


    const deleteButton =
        document.getElementById(
            "deleteRecordButton"
        );


    if (
        deleteButton
        &&
        deleteFunction
    ) {

        deleteButton.addEventListener(
            "click",
            deleteFunction
        );

    }

}

// =====================================================

function deleteCompany() {

    const company =
        getCompany(
            selectedCompanyId
        );


    if (!company) {
        return;
    }


    const confirmed =
        confirm(
            "Delete "
            +
            company.name
            +
            "?\n\n"
            +
            "Its application, contacts, activities and actions will also be deleted."
        );


    if (!confirmed) {
        return;
    }


    const companyId =
        company.company_id;


    removeFromArray(
        companies,
        item =>
            item.company_id ===
            companyId
    );


    removeFromArray(
        applications,
        item =>
            item.company_id ===
            companyId
    );


    removeFromArray(
        contacts,
        item =>
            item.company_id ===
            companyId
    );


    removeFromArray(
        activities,
        item =>
            item.company_id ===
            companyId
    );


    removeFromArray(
        actions,
        item =>
            item.company_id ===
            companyId
    );


    selectedCompanyId =
        companies.length > 0
            ?
            companies[0].company_id
            :
            null;


    currentContactId =
        null;

    currentActivityId =
        null;

    currentActionId =
        null;

    newRecordMode =
        false;


    refreshManagePage();


    showMessage(
        "Company and related records deleted."
    );

}

// =====================================================
// DELETE CONTACT
// =====================================================

function deleteContact() {

    const contact =
        contacts.find(
            item =>
                item.contact_id ===
                currentContactId
        );


    if (!contact) {
        return;
    }


    const confirmed =
        confirm(
            "Delete contact "
            +
            contact.name
            +
            "?"
        );


    if (!confirmed) {
        return;
    }


    const contactId =
        contact.contact_id;


    removeFromArray(
        contacts,
        item =>
            item.contact_id ===
            contactId
    );


    // Keep old activities but remove the
    // deleted contact reference.

    activities.forEach(
        activity => {

            if (
                activity.contact_id ===
                contactId
            ) {

                activity.contact_id =
                    null;

            }

        }
    );


    const remaining =
        getContacts(
            selectedCompanyId
        );


    currentContactId =
        remaining.length > 0
            ?
            remaining[0].contact_id
            :
            null;


    newRecordMode =
        false;


    refreshManagePage();


    showMessage(
        "Contact deleted."
    );

}
